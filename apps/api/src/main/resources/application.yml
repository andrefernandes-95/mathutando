server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: mathutando-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mathutando}
    username: ${DB_USER:mathutando}
    password: ${DB_PASSWORD:mathutando}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${WEB_ORIGIN:http://localhost:5173}
